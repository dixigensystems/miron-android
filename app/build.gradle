plugins { id 'com.android.application' }

android {
    namespace 'ru.dixigen.miron'
    compileSdk 34
    defaultConfig {
        applicationId "ru.dixigen.miron"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
}

dependencies {
    implementation 'com.k2fsa.sherpa:sherpa-onnx-android:1.10.31'
}
