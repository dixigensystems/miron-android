name: Build Miron APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android SDK 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Иконка ворона с сайта
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          curl -sL https://miron.dixigen.ru/agent/img/android-chrome-512x512.png -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Сборка
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: miron-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
